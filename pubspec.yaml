name: zirve
description: "Çalış 360 - AI destekli kişisel çalışma asistanı."
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_countdown_timer: ^4.1.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.5.0
  cloud_functions: ^6.3.6
  firebase_app_installations: ^0.4.2+7
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cupertino_icons: ^1.0.8
  table_calendar: ^3.0.9
  image_picker: ^0.8.7+6
  in_app_purchase: ^3.2.3
  flutter_local_notifications: 20.1.0
  firebase_storage: ^13.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "images/ic_launcher.png"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_background: "assets/icon_background.png"

flutter:
  uses-material-design: true
  assets:
    - images/turkce.jpg
    - images/matematik.jpg
    - images/tarih.jpg
    - images/cografya.jpg
    - images/felsefe.jpg
    - images/din.jpg
    - images/fizik.jpg
    - images/kimya.jpg
    - images/biyoloji.jpg
    - images/ic_launcher.png
    - assets/content/starter_content.json


  config:
    enable-swift-package-manager: false

