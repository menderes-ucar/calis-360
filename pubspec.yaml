name: zirve
description: "Çalış 360 - AI destekli kişisel çalışma asistanı."
publish_to: 'none'
version: 1.0.0+20

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_countdown_timer: ^4.1.0

  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.5.0
  cloud_functions: ^6.3.6
  firebase_app_installations: ^0.4.2+7
  firebase_storage: ^13.5.0

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  cupertino_icons: ^1.0.8
  table_calendar: ^3.0.9
  image_picker: ^0.8.7+6
  flutter_tts: ^4.2.5

  in_app_purchase: ^3.3.0

  flutter_local_notifications: 20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "images/calis360_icon1.png"
  adaptive_icon_background: "#F2E6DC"
  adaptive_icon_foreground: "images/calis360_icon1.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - images/turkce.jpg
    - images/matematik.jpg
    - images/tarih.jpg
    - images/cografya.jpg
    - images/felsefe.jpg
    - images/din.jpg
    - images/fizik.jpg
    - images/kimya.jpg
    - images/biyoloji.jpg
    - images/ic_launcher.png
    - assets/content/starter_content.json