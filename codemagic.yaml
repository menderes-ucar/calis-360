workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2

    environment:
      groups:
        - firebase
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menderesucar.calis360

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Restore Firebase configuration
        script: |
          echo "$FIREBASE_OPTIONS_B64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist

          test -s lib/firebase_options.dart || {
            echo "ERROR: lib/firebase_options.dart missing or empty"
            exit 1
          }

          test -s ios/Runner/GoogleService-Info.plist || {
            echo "ERROR: GoogleService-Info.plist missing or empty"
            exit 1
          }

          echo "Firebase files restored successfully"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Clean iOS pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-method=app-store

    artifacts:
      - build/ios/ipa/*.ipa