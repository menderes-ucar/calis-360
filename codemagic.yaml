workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - "ON"
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menderesucar.calis360

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Check Firebase environment variables
        script: |
          if [ -z "$FIREBASE_OPTIONS_B64" ]; then
            echo "ERROR: FIREBASE_OPTIONS_B64 is not available in Codemagic"
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_B64 is not available in Codemagic"
            exit 1
          fi

          echo "Firebase environment variables found"

      - name: Restore Firebase configuration
        script: |
          printf '%s' "$FIREBASE_OPTIONS_B64" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist

          if [ ! -s "lib/firebase_options.dart" ]; then
            echo "ERROR: lib/firebase_options.dart missing or empty"
            exit 1
          fi

          if [ ! -s "ios/Runner/GoogleService-Info.plist" ]; then
            echo "ERROR: ios/Runner/GoogleService-Info.plist missing or empty"
            exit 1
          fi

          echo "Firebase files restored successfully"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Clean and install iOS pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

          echo "=== EXPORT OPTIONS ==="
          if [ ! -f "/Users/builder/export_options.plist" ]; then
            echo "ERROR: /Users/builder/export_options.plist was not generated"
            exit 1
          fi

          plutil -p /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify generated IPA
        script: |
          echo "======================================"
          echo "SEARCHING FOR GENERATED IPA"
          echo "======================================"

          find "$CM_BUILD_DIR/build/ios" -type f -name "*.ipa" -print

          IPA_COUNT=$(find "$CM_BUILD_DIR/build/ios" -type f -name "*.ipa" | wc -l | tr -d ' ')

          echo "IPA count: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file was generated."
            echo "Archive contents:"
            find "$CM_BUILD_DIR/build/ios" -maxdepth 5 -type f -print 2>/dev/null | tail -200
            exit 1
          fi

          echo "IPA generated successfully"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration